name = "okavo-api"
main = "src/index.js"
compatibility_date = "2026-10-12"
account_id = "ec00d4a6131c20118d82605d6b969c8e"
workers_dev = true

[vars]
MAIL_FROM = "Okavo <support@okavo.org>"
# Okavo requires its own Razorpay merchant account because it is a marketplace.
# Keep both settings disabled until that account is approved and its own
# RAZORPAY_KEY_SECRET and RAZORPAY_WEBHOOK_SECRET have been installed.
RAZORPAY_KEY_ID = ""
RAZORPAY_PAYMENTS_ENABLED = "false"
# hosted = Razorpay Payment Link on razorpay.com. Keep this mode until the new
# marketplace merchant account approves okavo.org, then modal can be enabled.
# The browser still falls back to the Payment Link if the modal is blocked.
CHECKOUT_MODE = "hosted"
# Settling pending payments from the cron stays off until this is "true".
# The daily job still reports pending rows without charging or settling.
ALLOW_PAYMENT_RECONCILIATION = "false"
ADMIN_EMAILS = "fakhruddinkhambaty@gmail.com,fktiindia@gmail.com"

[triggers]
crons = ["17 3 * * 1", "47 4 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "okavo"
database_id = "3d3afb8e-1749-4c70-8001-e115504e3b03"

# R2 is not enabled on this Cloudflare account (API error 10042).
# Do not add a bucket binding until the account can create one.
# Identity and proof files stay in D1. When R2 is enabled, add:
# [[r2_buckets]]
# binding = "FILES"
# bucket_name = "okavo-private"
