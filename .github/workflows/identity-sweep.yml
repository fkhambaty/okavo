name: Identity retention sweep

# Asks the Worker to delete identity files whose 90-day window has ended.
# The Worker cron does the same job. This workflow is the visible check that
# the ops secret is wired. It never prints the secret.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: identity-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Run retention sweep
    runs-on: ubuntu-latest
    steps:
      - name: Require the ops secret
        id: secrets
        env:
          OPS_CRON_SECRET: ${{ secrets.OPS_CRON_SECRET }}
        run: |
          if [ -z "$OPS_CRON_SECRET" ]; then
            echo "::error::OPS_CRON_SECRET is not set. The Worker cron can still purge, but this job cannot call it."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Invoke Worker retention
        if: steps.secrets.outputs.configured == 'true'
        env:
          OPS_CRON_SECRET: ${{ secrets.OPS_CRON_SECRET }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          status="$(curl -sS -o "$body" -w '%{http_code}' -X POST \
            "https://okavo-api.fkhambaty.workers.dev/v1/ops/retention" \
            -H "x-okavo-ops: ${OPS_CRON_SECRET}" \
            -H "content-type: application/json" \
            --data '{}')"
          echo "HTTP $status"
          # Do not print the body if it might echo a header. Print only the status fields we expect.
          node -e 'const fs=require("fs"); const raw=fs.readFileSync(process.argv[1],"utf8"); const data=JSON.parse(raw); const safe={ok:data.ok,purged:data.purged,storage:data.storage,error:data.error}; console.log(JSON.stringify(safe));' "$body"
          if [ "$status" != "200" ]; then
            echo "::error::retention returned $status"
            exit 1
          fi
