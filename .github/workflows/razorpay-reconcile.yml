name: Razorpay reconcile

# Report-only unless the Worker variable ALLOW_PAYMENT_RECONCILIATION is "true".
# This job asks for a report. It does not send apply:true, so it cannot settle.

on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

concurrency:
  group: razorpay-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    name: Report pending payments
    runs-on: ubuntu-latest
    steps:
      - name: Require the ops secret
        id: secrets
        env:
          OPS_CRON_SECRET: ${{ secrets.OPS_CRON_SECRET }}
        run: |
          if [ -z "$OPS_CRON_SECRET" ]; then
            echo "::error::OPS_CRON_SECRET is not set. Pending payments are not being reported from GitHub."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Invoke Worker reconcile
        if: steps.secrets.outputs.configured == 'true'
        env:
          OPS_CRON_SECRET: ${{ secrets.OPS_CRON_SECRET }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          status="$(curl -sS -o "$body" -w '%{http_code}' -X POST \
            "https://okavo-api.fkhambaty.workers.dev/v1/ops/reconcile" \
            -H "x-okavo-ops: ${OPS_CRON_SECRET}" \
            -H "content-type: application/json" \
            --data '{"apply":false}')"
          echo "HTTP $status"
          node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const safe={pending:data.pending,settled:data.settled,unchanged:data.unchanged,mismatched:data.mismatched,apply:data.apply,charge:data.charge,checkout:data.checkout,reason:data.reason,error:data.error}; if(safe.charge!==false){console.error("reconcile reported a charge"); process.exit(1);} console.log(JSON.stringify(safe));' "$body"
          if [ "$status" != "200" ]; then
            echo "::error::reconcile returned $status"
            exit 1
          fi
