name: Razorpay reconcile

# Report-only drift check between pending Okavo payments and Razorpay.
# Safe by default: the edge function only applies settlements when
# ALLOW_PAYMENT_RECONCILIATION=true is set on the function secrets.

on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

concurrency:
  group: razorpay-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    name: Run reconcile (report mode)
    runs-on: ubuntu-latest
    steps:
      - name: Detect secrets
        id: secrets
        run: |
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "Supabase reconcile was retired on 13 October 2026. The Worker does not settle payments from this job."

      - name: Invoke razorpay-reconcile
        if: steps.secrets.outputs.configured == 'true'
        env:
          PROD_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          RAZORPAY_RECONCILE_SECRET: ${{ secrets.RAZORPAY_RECONCILE_SECRET }}
        run: |
          set -euo pipefail
          url="${PROD_SUPABASE_URL%/}/functions/v1/razorpay-reconcile"
          body="$(mktemp)"
          status="$(curl -sS -o "$body" -w '%{http_code}' -X POST "$url" \
            -H "x-okavo-notify: ${RAZORPAY_RECONCILE_SECRET}" \
            -H "content-type: application/json" \
            --data '{}')"
          echo "HTTP $status"
          cat "$body"
          echo
          if [ "$status" != "200" ]; then
            echo "::error::razorpay-reconcile returned $status"
            exit 1
          fi
