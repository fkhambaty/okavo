name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, typecheck, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Worker checks
        run: npm test

      - name: Build
        env:
          VITE_OKAVO_API_URL: https://okavo-api.fkhambaty.workers.dev
        run: npm run build

      - name: Shared package tests
        run: npm test -w @okavo/core

      - name: Install mobile app
        working-directory: apps/mobile
        run: npm ci

      - name: Mobile typecheck, lint, tests, Expo Doctor
        working-directory: apps/mobile
        run: |
          npm run typecheck
          npm run lint
          npm test
          npx expo-doctor
