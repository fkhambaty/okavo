<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
    <defs>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0A0B0D" flood-opacity="0.12"/>
      </filter>
      <clipPath id="phoneClip"><rect x="1166" y="95" width="304" height="660" rx="42"/></clipPath>
    </defs>
    
    
    <rect width="1600" height="900" fill="#F5F2EC"/>
    <circle cx="1510" cy="-30" r="245" fill="#B66A0A" opacity="0.11"/>
    <circle cx="35" cy="910" r="210" fill="#D6A655" opacity="0.09"/>
    <rect x="64" y="46" width="176" height="42" rx="21" fill="#F1E2C9"/>
    <text x="152" y="74" fill="#B66A0A" font-family="Archivo" font-size="17" font-weight="700" text-anchor="middle" opacity="1"  letter-spacing="1.1">
    <tspan x="152" dy="0">WHY APPROVE</tspan>
  </text>
    <text x="64" y="132" fill="#0A0B0D" font-family="Archivo" font-size="48" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="64" dy="0">A serious marketplace in a</tspan><tspan x="64" dy="56">small-screen format</tspan>
  </text>
    <line x1="64" y1="842" x2="1536" y2="842" stroke="#D9D1C4" stroke-width="2"/>
    <text x="64" y="874" fill="#66635D" font-family="Inter" font-size="17" font-weight="600" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="64" dy="0">Okavo</tspan>
  </text>
    <text x="1536" y="874" fill="#66635D" font-family="Inter" font-size="17" font-weight="700" text-anchor="end" opacity="1"  letter-spacing="0">
    <tspan x="1536" dy="0">12</tspan>
  </text>
  
    <text x="64" y="252" fill="#66635D" font-family="Inter" font-size="30" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="64" dy="0">The mobile product makes Okavo’s strongest idea more</tspan><tspan x="64" dy="40">accessible: clearly defined work matched with visible</tspan><tspan x="64" dy="40">evidence.</tspan>
  </text>
    <rect x="64" y="430" width="456" height="300" rx="28" fill="#FFFFFF" stroke="#D9D1C4" stroke-width="2"/>
        <circle cx="126" cy="495" r="29" fill="#F1E2C9"/>
   <text x="126" y="502.54" fill="#B66A0A" font-family="Archivo" font-size="24.94" font-weight="800" text-anchor="middle" opacity="1"  letter-spacing="0">
    <tspan x="126" dy="0">C</tspan>
  </text>
        <text x="102" y="570" fill="#0A0B0D" font-family="Archivo" font-size="25" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="102" dy="0">Clarity</tspan>
  </text>
        <text x="102" y="650" fill="#66635D" font-family="Inter" font-size="18" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="102" dy="0">Requirements, bids and contracts</tspan><tspan x="102" dy="25">stay connected to the work.</tspan>
  </text><rect x="564" y="430" width="456" height="300" rx="28" fill="#FFFFFF" stroke="#D9D1C4" stroke-width="2"/>
        <circle cx="626" cy="495" r="29" fill="#F1E2C9"/>
   <text x="626" y="502.54" fill="#B66A0A" font-family="Archivo" font-size="24.94" font-weight="800" text-anchor="middle" opacity="1"  letter-spacing="0">
    <tspan x="626" dy="0">T</tspan>
  </text>
        <text x="602" y="570" fill="#0A0B0D" font-family="Archivo" font-size="25" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="602" dy="0">Trust</tspan>
  </text>
        <text x="602" y="650" fill="#66635D" font-family="Inter" font-size="18" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="602" dy="0">Identity, roles and audit</tspan><tspan x="602" dy="25">boundaries are visible without</tspan><tspan x="602" dy="25">inflated guarantees.</tspan>
  </text><rect x="1064" y="430" width="456" height="300" rx="28" fill="#FFFFFF" stroke="#D9D1C4" stroke-width="2"/>
        <circle cx="1126" cy="495" r="29" fill="#F1E2C9"/>
   <text x="1126" y="502.54" fill="#B66A0A" font-family="Archivo" font-size="24.94" font-weight="800" text-anchor="middle" opacity="1"  letter-spacing="0">
    <tspan x="1126" dy="0">M</tspan>
  </text>
        <text x="1102" y="570" fill="#0A0B0D" font-family="Archivo" font-size="25" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="1102" dy="0">Mobility</tspan>
  </text>
        <text x="1102" y="650" fill="#66635D" font-family="Inter" font-size="18" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="1102" dy="0">Messages, files and decisions can</tspan><tspan x="1102" dy="25">move with the people doing the</tspan><tspan x="1102" dy="25">work.</tspan>
  </text>
  
  </svg>