    <tspan x="200" dy="0">MOBILE ARCHITECTURE</tspan>
  </text>
    <text x="64" y="132" fill="#0A0B0D" font-family="Archivo" font-size="48" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="64" dy="0">A fully native operational shell</tspan>
  </text>
    <line x1="64" y1="842" x2="1536" y2="842" stroke="#D9D1C4" stroke-width="2"/>
    <text x="64" y="874" fill="#66635D" font-family="Inter" font-size="17" font-weight="600" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="64" dy="0">Okavo</tspan>
  </text>
    <text x="1536" y="874" fill="#66635D" font-family="Inter" font-size="17" font-weight="700" text-anchor="end" opacity="1"  letter-spacing="0">
    <tspan x="1536" dy="0">09</tspan>
  </text>
  
    <text x="64" y="220" fill="#66635D" font-family="Inter" font-size="25" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="64" dy="0">Role-sensitive product flows run in React Native while the existing API remains the</tspan><tspan x="64" dy="34">authoritative business layer.</tspan>
  </text>
    <rect x="64" y="325" width="330" height="300" rx="24" fill="#F1E2C9" stroke="#D9D1C4" stroke-width="2"/>
    <text x="92" y="370" fill="#0A0B0D" font-family="Archivo" font-size="22" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="92" dy="0">Android + iOS</tspan>
  </text>
    <text x="92" y="407" fill="#66635D" font-family="Inter" font-size="16" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="92" dy="0">One React Native product</tspan><tspan x="92" dy="23">with platform packaging,</tspan><tspan x="92" dy="23">icons and permissions.</tspan>
  </text>
    <rect x="482" y="325" width="330" height="300" rx="24" fill="#FFFFFF" stroke="#D9D1C4" stroke-width="2"/>
    <text x="510" y="370" fill="#0A0B0D" font-family="Archivo" font-size="22" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="510" dy="0">Role-aware shell</tspan>
  </text>
    <text x="510" y="407" fill="#66635D" font-family="Inter" font-size="16" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="510" dy="0">Public, buyer, developer</tspan><tspan x="510" dy="23">and administrator</tspan><tspan x="510" dy="23">navigation with guarded</tspan><tspan x="510" dy="23">routes.</tspan>
  </text>
    <rect x="900" y="325" width="330" height="300" rx="24" fill="#FFFFFF" stroke="#D9D1C4" stroke-width="2"/>
    <text x="928" y="370" fill="#0A0B0D" font-family="Archivo" font-size="22" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="928" dy="0">Device capabilities</tspan>
  </text>
    <text x="928" y="407" fill="#66635D" font-family="Inter" font-size="16" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="928" dy="0">Secure storage, camera,</tspan><tspan x="928" dy="23">file picker, downloads and</tspan><tspan x="928" dy="23">notifications.</tspan>
  </text>
    <rect x="1318" y="325" width="218" height="300" rx="24" fill="#FFFFFF" stroke="#D9D1C4" stroke-width="2"/>
    <text x="1346" y="370" fill="#0A0B0D" font-family="Archivo" font-size="22" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="1346" dy="0">Existing API</tspan>
  </text>
    <text x="1346" y="407" fill="#66635D" font-family="Inter" font-size="16" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="1346" dy="0">Identity,</tspan><tspan x="1346" dy="23">projects, bids,</tspan><tspan x="1346" dy="23">contracts,</tspan><tspan x="1346" dy="23">messages, files</tspan><tspan x="1346" dy="23">and operations.</tspan>
  </text>
