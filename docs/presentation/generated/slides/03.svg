    <tspan x="1536" dy="0">03</tspan>
  </text>
  
    <text x="64" y="220" fill="#66635D" font-family="Inter" font-size="26" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="64" dy="0">Public trust, buying, delivery and platform operations each have a distinct mobile</tspan><tspan x="64" dy="35">surface.</tspan>
  </text>
