    <tspan x="94" dy="0">How it works, FAQ, terms,</tspan><tspan x="94" dy="24">privacy, security and explicit</tspan><tspan x="94" dy="24">non-guarantees.</tspan>
  </text><rect x="437.5" y="320" width="351.5" height="430" rx="28" fill="#FFFFFF" stroke="#D9D1C4" stroke-width="2"/>
