  </text>
        <line x1="841" y1="625" x2="1132.5" y2="625" stroke="#D9D1C4" stroke-width="2"/>
        <text x="841" y="663" fill="#0A0B0D" font-family="Inter" font-size="17" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
