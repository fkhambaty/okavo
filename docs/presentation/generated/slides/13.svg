    <tspan x="110" dy="0">Approve the marketplace</tspan><tspan x="110" dy="27">experience</tspan>
  </text><rect x="572" y="600" width="450" height="150" rx="26" fill="#FFFFFF" stroke="#D9D1C4" stroke-width="2"/>
