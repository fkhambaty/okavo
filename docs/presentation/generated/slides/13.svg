  </text>
    <text x="82" y="440" fill="#CAC4B9" font-family="Inter" font-size="28" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="82" dy="0">The product story, role model and mobile</tspan><tspan x="82" dy="39">architecture are ready. The remaining gates are</tspan><tspan x="82" dy="39">controlled credentials, signed iOS testing and store</tspan><tspan x="82" dy="39">review.</tspan>
